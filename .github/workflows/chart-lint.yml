name: ChartLint

on:
  pull_request:
    # only run when there are chart changes
    paths:
      - 'charts/**'
      - '!charts/charts.mk'
      - '!charts/go*'

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: '0'

      - uses: actions/setup-go@90ad2b35f69faf97585ad74d28fa006d2739b7af # v7
        with:
          go-version-file: 'charts/go.mod'
          cache-dependency-path: 'charts/go.sum'

      - name: Verify charts are upt-do-date
        run: make chart-lint

  template:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Render Helm charts
        run: find charts -type f -name Chart.yaml -exec .github/render-charts.sh {} \;
